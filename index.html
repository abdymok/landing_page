<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abdymok</title>
<meta name="description" content="kyiv. dnipro. two unicyclers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{background:#fff;color:#111;font-family:Spectral,Georgia,"Times New Roman",serif;font-weight:400}
main{width:100%;height:100dvh;display:flex;flex-direction:column}
.top{padding:5vh 5vw 2.5vh;font-size:15px;line-height:1.45}
.topline{display:block}
.top a{color:inherit;text-decoration:none}
.route{margin-top:10px}
.top a:hover{opacity:.62}
.credit{margin-top:24px;font-size:11.5px}
.credit .y{color:#b00000}
.film{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;background:#fff;overflow:hidden}
video{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;object-position:center bottom;background:#fff;cursor:pointer;filter:none;border:0;outline:0}
@media(max-width:700px){
.top{padding:4vh 20px 2.5vh;font-size:14px}
.topline{display:block}
.top .route{margin-top:10px}
.credit{margin-top:20px;font-size:11px}
}
@media(max-width:700px) and (orientation:landscape){
.top{padding:2vh 20px 0}
.film{align-items:flex-end;margin-top:-1px}
video{width:100vw;height:100%;max-height:none;object-fit:cover;object-position:center bottom;transform:scale(1.14);transform-origin:center bottom}
}
</style>
</head>
<body>
<main>
<div class="top">
<div class="topline"><span>kyiv. dnipro. two unicyclers.</span></div>
<div class="route"><a href="https://abdymok.github.io/40/">enter</a></div>
<div class="credit">archived by abd<span class="y">y</span>mok</div>
</div>
<div class="film"><video autoplay muted loop playsinline preload="metadata" aria-label="Black and white video of two unicyclers beside the Dnipro in Kyiv"><source src="unicyclers-white-background-smooth-white (1).mp4" type="video/mp4"></video></div>
</main>
<script>
const film=document.querySelector('video');
film.addEventListener('click',()=>film.paused?film.play():film.pause());
</script>
</body>
</html>
