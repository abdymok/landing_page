video{display:none}
}

</main>
<script>
const film=document.querySelector('video');
function tryPlay(){
  const p=film.play();
  if(p && typeof p.catch==='function') p.catch(()=>{});
}
function setPlayback(){
  if(!film) return;
  // Let iOS Safari decode and display the opening frame naturally.
  // No programmatic seek during initial load.
  film.loop=true;
  tryPlay();
}
film.addEventListener('loadedmetadata',setPlayback);
film.addEventListener('loadeddata',setPlayback);
film.addEventListener('canplay',setPlayback);
film.addEventListener('playing',()=>{film.style.visibility='visible';});
film.addEventListener('click',()=>{if(window.matchMedia("(max-width:700px) and (orientation:portrait)").matches)return;film.paused?tryPlay():film.pause();});
window.addEventListener('pageshow',setPlayback);
window.addEventListener('resize',setPlayback);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setPlayback();});
setPlayback();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}))}</script>
